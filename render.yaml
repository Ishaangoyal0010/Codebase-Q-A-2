services:
  - type: web
    name: codebase-qa-backend
    plan: free
    runtime: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ragdb
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: codebase-qa-frontend
    plan: free
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: BACKEND_URL
        sync: false



databases:
  - name: ragdb
    plan: free
    databaseName: ragdb
    user: raguser
